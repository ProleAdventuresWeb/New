    "@context": "https://schema.org",
    "@graph": [

        "@type": "WebSite",
        "name": "Prole Adventures",
        "url": "https://proleadventures.com/",
        "description": "Exploring what's left of freedom through an unfiltered perspective on ordinary life."
      },

        "name": "Prole Adventures",

          "https://www.youtube.com/@ProleAdventures"
        ]
      }
    ]
  }
  </script>

  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="QEwf6-PfHFxK1V8Xr-kI1bCI2iYBRO9Ue5hThLN0v3o" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="/images/logo-prole.webp" />
  <link rel="apple-touch-icon" href="/images/logo-prole.webp" />
  
  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://apis.google.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="preload" as="image" href="/images/hero-logo.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/images/prole_adventures_home_hero.webp" fetchpriority="high" />
  <link rel="preload" href="/fonts/ChelseaMarket-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
  </noscript>
</head>

<body>
  <!-- Hidden SVG for Torn Edge filter -->
  <svg width="0" height="0" style="position: absolute; overflow: hidden; pointer-events: none;">
    <filter id="torn-edge" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Generate noise -->
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <!-- Displace the element's alpha channel based on the noise -->
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="torn-edge-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  
  <div id="root"></div>
  
  <!-- Main React/Vite Script -->
  <script type="module" src="/src/main.tsx"></script>


</body>
</html>
